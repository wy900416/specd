openapi: 3.1.0
info:
  title: Orders API
  version: 0.1.0
paths:
  /orders:
    post:
      operationId: createOrder
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Order created
        "402":
          description: Payment declined
