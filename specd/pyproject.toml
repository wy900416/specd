[project]
name = "specd"
version = "0.1.0"
description = "A spec graph toolkit: validate, index, pack context, propose/release, and render agent-readable specs."
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
specd = "specd.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["specd*"]
